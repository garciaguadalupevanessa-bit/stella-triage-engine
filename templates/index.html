<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stella Triage Engine - Control Panel</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-950/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 p-2 rounded-lg text-white">
                    <i data-lucide="cpu" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-none">Stella Triage Engine</h1>
                    <span class="text-xs text-slate-400">AI Triage & SAP MM Lifecycle</span>
                </div>
            </div>
            
            <!-- Main Role Tabs -->
            <nav class="flex bg-slate-900 p-1 rounded-xl border border-slate-800">
                <button onclick="switchTab('user')" id="tab-user" class="px-4 py-1.5 rounded-lg text-sm font-medium transition flex items-center space-x-2 bg-indigo-600 text-white">
                    <i data-lucide="user" class="w-4 h-4"></i>
                    <span>Usuario</span>
                </button>
                <button onclick="switchTab('admin')" id="tab-admin" class="px-4 py-1.5 rounded-lg text-sm font-medium transition flex items-center space-x-2 text-slate-400 hover:text-white">
                    <i data-lucide="shield-check" class="w-4 h-4"></i>
                    <span>Admin Review</span>
                </button>
                <button onclick="switchTab('tech')" id="tab-tech" class="px-4 py-1.5 rounded-lg text-sm font-medium transition flex items-center space-x-2 text-slate-400 hover:text-white">
                    <i data-lucide="wrench" class="w-4 h-4"></i>
                    <span>Técnico & SAP MM</span>
                </button>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-8">

        <!-- USER VIEW -->
        <section id="view-user" class="space-y-6">
            <div class="bg-slate-800/50 border border-slate-700/50 rounded-2xl p-6">
                <h2 class="text-xl font-bold mb-4 flex items-center space-x-2">
                    <i data-lucide="plus-circle" class="text-indigo-400"></i>
                    <span>Crear Nueva Incidencia</span>
                </h2>
                <form id="create-ticket-form" onsubmit="handleCreateTicket(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Descripción del problema</label>
                        <textarea id="query-input" required rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-indigo-500" placeholder="Ej: El compresor de aire acondicionado hace un ruido extraño y no enfría..."></textarea>
                    </div>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-2.5 rounded-xl transition flex items-center space-x-2">
                        <i data-lucide="send" class="w-4 h-4"></i>
                        <span>Enviar Incidencia</span>
                    </button>
                </form>
            </div>
        </section>

        <!-- ADMIN VIEW -->
        <section id="view-admin" class="hidden space-y-6">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <h2 class="text-xl font-bold flex items-center space-x-2">
                        <i data-lucide="shield" class="text-amber-400"></i>
                        <span>Gobernanza y Validación Humana</span>
                    </h2>
                    <p class="text-xs text-slate-400">Supervisión de categorización IA y derivación a equipos</p>
                </div>
                
                <!-- Admin Sub-Filters -->
                <div class="flex bg-slate-950 p-1 rounded-lg border border-slate-800 text-xs font-medium">
                    <button onclick="setAdminFilter('PENDING_ADMIN_REVIEW')" id="admin-filter-PENDING_ADMIN_REVIEW" class="px-3 py-1.5 rounded-md transition bg-amber-600 text-white">
                        Pendientes de Verificación
                    </button>
                    <button onclick="setAdminFilter('ASSIGNED_TO_TECHNICAL')" id="admin-filter-ASSIGNED_TO_TECHNICAL" class="px-3 py-1.5 rounded-md transition text-slate-400 hover:text-white">
                        Asignadas a Técnico
                    </button>
                    <button onclick="setAdminFilter('ALL')" id="admin-filter-ALL" class="px-3 py-1.5 rounded-md transition text-slate-400 hover:text-white">
                        Todas
                    </button>
                </div>
            </div>

            <div id="admin-tickets-container" class="grid gap-4"></div>
        </section>

        <!-- TECH / SAP MM VIEW -->
        <section id="view-tech" class="hidden space-y-6">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <h2 class="text-xl font-bold flex items-center space-x-2">
                        <i data-lucide="boxes" class="text-emerald-400"></i>
                        <span>Panel Operativo Técnico e Integración SAP MM</span>
                    </h2>
                    <p class="text-xs text-slate-400">Gestión de órdenes de trabajo, SolPeds y recepción MIGO 101</p>
                </div>

                <!-- Tech Sub-Filters -->
                <div class="flex bg-slate-950 p-1 rounded-lg border border-slate-800 text-xs font-medium flex-wrap gap-1">
                    <button onclick="setTechFilter('ASSIGNED_TO_TECHNICAL')" id="tech-filter-ASSIGNED_TO_TECHNICAL" class="px-3 py-1.5 rounded-md transition bg-indigo-600 text-white">
                        Pte. Reparación
                    </button>
                    <button onclick="setTechFilter('AWAITING_SAP_STOCK')" id="tech-filter-AWAITING_SAP_STOCK" class="px-3 py-1.5 rounded-md transition text-slate-400 hover:text-white">
                        Pte. Material (SAP MM)
                    </button>
                    <button onclick="setTechFilter('RESOLVED')" id="tech-filter-RESOLVED" class="px-3 py-1.5 rounded-md transition text-slate-400 hover:text-white">
                        Resueltos
                    </button>
                    <button onclick="setTechFilter('ALL')" id="tech-filter-ALL" class="px-3 py-1.5 rounded-md transition text-slate-400 hover:text-white">
                        Todos
                    </button>
                </div>
            </div>

            <div id="tech-tickets-container" class="grid gap-4"></div>
        </section>

    </main>

    <script>
        const API_URL = window.location.origin;
        let globalTickets = [];
        let currentAdminFilter = 'PENDING_ADMIN_REVIEW';
        let currentTechFilter = 'ASSIGNED_TO_TECHNICAL';

        function switchTab(role) {
            ['user', 'admin', 'tech'].forEach(r => {
                document.getElementById(`view-${r}`).classList.add('hidden');
                document.getElementById(`tab-${r}`).className = 'px-4 py-1.5 rounded-lg text-sm font-medium transition flex items-center space-x-2 text-slate-400 hover:text-white';
            });
            document.getElementById(`view-${role}`).classList.remove('hidden');
            document.getElementById(`tab-${role}`).className = 'px-4 py-1.5 rounded-lg text-sm font-medium transition flex items-center space-x-2 bg-indigo-600 text-white';
            loadTickets();
        }

        async function loadTickets() {
            try {
                const res = await fetch(`${API_URL}/tickets`);
                globalTickets = await res.json();
                renderAdminTickets();
                renderTechTickets();
            } catch (err) {
                console.error("Error cargando tickets:", err);
            }
        }

        function setAdminFilter(filter) {
            currentAdminFilter = filter;
            ['PENDING_ADMIN_REVIEW', 'ASSIGNED_TO_TECHNICAL', 'ALL'].forEach(f => {
                const btn = document.getElementById(`admin-filter-${f}`);
                if (btn) btn.className = f === filter 
                    ? 'px-3 py-1.5 rounded-md transition bg-amber-600 text-white' 
                    : 'px-3 py-1.5 rounded-md transition text-slate-400 hover:text-white';
            });
            renderAdminTickets();
        }

        function setTechFilter(filter) {
            currentTechFilter = filter;
            ['ASSIGNED_TO_TECHNICAL', 'AWAITING_SAP_STOCK', 'RESOLVED', 'ALL'].forEach(f => {
                const btn = document.getElementById(`tech-filter-${f}`);
                if (btn) btn.className = f === filter 
                    ? 'px-3 py-1.5 rounded-md transition bg-indigo-600 text-white' 
                    : 'px-3 py-1.5 rounded-md transition text-slate-400 hover:text-white';
            });
            renderTechTickets();
        }

        async function handleCreateTicket(e) {
            e.preventDefault();
            const query = document.getElementById('query-input').value;
            await fetch(`${API_URL}/tickets`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query, user_id: 'usr_vanessa' })
            });
            document.getElementById('query-input').value = '';
            alert('Incidencia creada correctamente');
            switchTab('admin');
        }

        function renderAdminTickets() {
            const container = document.getElementById('admin-tickets-container');
            let filtered = globalTickets;
            if (currentAdminFilter !== 'ALL') {
                filtered = globalTickets.filter(t => t.status === currentAdminFilter);
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="bg-slate-800/20 border border-slate-800 rounded-xl p-8 text-center text-slate-400">
                        <i data-lucide="inbox" class="w-8 h-8 text-slate-500 mx-auto mb-2"></i>
                        <p class="font-medium">No hay incidencias en esta categoría.</p>
                    </div>`;
                lucide.createIcons();
                return;
            }

            container.innerHTML = filtered.map(t => `
                <div class="bg-slate-800/40 border border-slate-700/50 rounded-xl p-5 space-y-3">
                    <div class="flex justify-between items-start">
                        <span class="text-xs bg-slate-700 text-slate-300 px-2.5 py-1 rounded-md font-mono">ID #${t.id}</span>
                        <span class="text-xs ${t.status === 'PENDING_ADMIN_REVIEW' ? 'bg-amber-500/10 text-amber-400 border-amber-500/20' : 'bg-indigo-500/10 text-indigo-400 border-indigo-500/20'} border px-2.5 py-1 rounded-md font-medium">${t.status}</span>
                    </div>
                    <p class="text-slate-200 font-medium text-base">${t.query}</p>
                    <div class="text-xs text-slate-300 bg-slate-900/60 p-3 rounded-lg border border-slate-800 grid grid-cols-1 md:grid-cols-3 gap-2">
                        <div><strong class="text-slate-400">Categoría IA:</strong><br>${t.category || 'N/A'}</div>
                        <div><strong class="text-slate-400">Urgencia:</strong><br><span class="text-amber-400">${t.urgency || 'N/A'}</span></div>
                        <div><strong class="text-slate-400">Departamento:</strong><br>${t.department || 'N/A'}</div>
                    </div>
                    ${t.status === 'PENDING_ADMIN_REVIEW' ? `
                        <div class="pt-2">
                            <button onclick="reviewTicket(${t.id})" class="bg-amber-600 hover:bg-amber-500 text-white text-sm font-medium px-4 py-2 rounded-lg transition flex items-center space-x-2">
                                <i data-lucide="user-check" class="w-4 h-4"></i>
                                <span>Aprobar y Asignar a Técnico</span>
                            </button>
                        </div>
                    ` : ''}
                </div>
            `).join('');
            lucide.createIcons();
        }

        async function reviewTicket(id) {
            await fetch(`${API_URL}/tickets/${id}/review`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ approved: true })
            });
            loadTickets();
        }

        function renderTechTickets() {
            const container = document.getElementById('tech-tickets-container');
            let filtered = globalTickets;
            if (currentTechFilter !== 'ALL') {
                filtered = globalTickets.filter(t => t.status === currentTechFilter);
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="bg-slate-800/20 border border-slate-800 rounded-xl p-8 text-center text-slate-400">
                        <i data-lucide="check-circle-2" class="w-8 h-8 text-slate-500 mx-auto mb-2"></i>
                        <p class="font-medium">No hay incidencias registradas en este estado.</p>
                    </div>`;
                lucide.createIcons();
                return;
            }

            container.innerHTML = filtered.map(t => {
                let statusBadge = '';
                let actionButtons = '';
                let sapCard = '';

                if (t.status === 'ASSIGNED_TO_TECHNICAL') {
                    statusBadge = `<span class="text-xs bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-2.5 py-1 rounded-md font-medium">PTE. REPARACIÓN</span>`;
                    actionButtons = `
                        <div class="flex space-x-2 pt-2">
                            <button onclick="resolveTicketDirect(${t.id})" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium px-3.5 py-2 rounded-lg transition flex items-center space-x-1">
                                <i data-lucide="check" class="w-4 h-4"></i>
                                <span>Reparar Directamente</span>
                            </button>
                            <button onclick="requestSapParts(${t.id})" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium px-3.5 py-2 rounded-lg transition flex items-center space-x-1">
                                <i data-lucide="shopping-bag" class="w-4 h-4"></i>
                                <span>Solicitar Recambio SAP MM (SolPed)</span>
                            </button>
                        </div>
                    `;
                } else if (t.status === 'AWAITING_SAP_STOCK') {
                    statusBadge = `<span class="text-xs bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2.5 py-1 rounded-md font-medium">PTE. MATERIAL (SAP MM)</span>`;
                    sapCard = `
                        <div class="bg-slate-900 border border-slate-800 p-3.5 rounded-xl text-xs space-y-1.5">
                            <div class="text-amber-400 font-semibold flex items-center space-x-1">
                                <i data-lucide="package" class="w-4 h-4"></i>
                                <span>Solicitud de Pedido (SolPed SAP): #${t.sap_solped_id}</span>
                            </div>
                            <div class="text-slate-300">Material Requerido: <span class="font-mono text-indigo-300">${t.sap_material_id}</span></div>
                            <div class="text-slate-400">Estado SAP MM: ${t.sap_status}</div>
                        </div>
                    `;
                    actionButtons = `
                        <div class="pt-2">
                            <button onclick="receiveGoods(${t.id})" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium px-3.5 py-2 rounded-lg transition flex items-center space-x-1">
                                <i data-lucide="box" class="w-4 h-4"></i>
                                <span>Registrar Recepción de Pieza MIGO 101 & Cerrar</span>
                            </button>
                        </div>
                    `;
                } else if (t.status === 'RESOLVED') {
                    statusBadge = `<span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2.5 py-1 rounded-md font-medium">RESUELTO / CERRADO</span>`;
                    if (t.sap_solped_id) {
                        sapCard = `
                            <div class="bg-slate-900/60 border border-slate-800 p-3.5 rounded-xl text-xs space-y-1">
                                <div class="text-emerald-400 font-semibold flex items-center space-x-1">
                                    <i data-lucide="check-circle" class="w-4 h-4"></i>
                                    <span>Movimiento SAP MIGO 101 Completado (SolPed #${t.sap_solped_id})</span>
                                </div>
                                <div class="text-slate-400">Material: ${t.sap_material_id}</div>
                            </div>
                        `;
                    }
                } else {
                    statusBadge = `<span class="text-xs bg-slate-700 text-slate-300 px-2.5 py-1 rounded-md">${t.status}</span>`;
                }

                return `
                    <div class="bg-slate-800/40 border border-slate-700/50 rounded-xl p-5 space-y-3">
                        <div class="flex justify-between items-start">
                            <span class="text-xs bg-slate-700 text-slate-300 px-2.5 py-1 rounded-md font-mono">ID #${t.id}</span>
                            ${statusBadge}
                        </div>
                        <p class="text-slate-200 font-medium">${t.query}</p>
                        
                        <div class="text-xs text-slate-400 bg-slate-900/40 p-2.5 rounded-lg border border-slate-800">
                            <strong>Resumen / Trazabilidad:</strong> ${t.summary || 'Sin detalles'}
                        </div>

                        ${sapCard}
                        ${actionButtons}
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        async function resolveTicketDirect(id) {
            await fetch(`${API_URL}/tickets/${id}/action`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action_type: 'RESOLVE', resolution_notes: 'Reparación realizada directamente por técnico.' })
            });
            loadTickets();
        }

        async function requestSapParts(id) {
            await fetch(`${API_URL}/tickets/${id}/action`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action_type: 'REQUEST_PARTS', material_id: 'MAT-COMPRESOR-AC' })
            });
            loadTickets();
        }

        async function receiveGoods(id) {
            await fetch(`${API_URL}/tickets/${id}/sap-goods-receipt`, {
                method: 'POST'
            });
            loadTickets();
        }

        // Inicializar
        lucide.createIcons();
        loadTickets();
    </script>
</body>
</html>
